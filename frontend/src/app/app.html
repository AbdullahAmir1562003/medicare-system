<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-3">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center" routerLink="/dashboard">
      <i class="bi bi-heart-pulse-fill me-2 fs-4"></i> MediCare
    </a>

    <div class="ms-auto d-flex align-items-center gap-3">
      <!-- When Logged In -->
      <ng-container *ngIf="currentUser">
        <div class="d-flex align-items-center text-white">
          <div class="rounded-circle bg-white text-primary fw-bold d-flex align-items-center justify-content-center me-2" style="width: 38px; height: 38px;">
            {{ (currentUser?.name ? currentUser.name[0] : 'U') | uppercase }}
          </div>
          <div class="d-none d-sm-block text-start">
            <div class="fw-semibold small leading-tight">{{ currentUser?.name }}</div>
            <span class="badge bg-light text-primary px-2 py-0" style="font-size: 0.68rem;">
              {{ currentUser?.role | uppercase }}
            </span>
          </div>
        </div>
        <button class="btn btn-outline-light btn-sm rounded-pill px-3 ms-2" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </ng-container>

      <!-- When Logged Out -->
      <ng-container *ngIf="!currentUser">
        <a routerLink="/login" class="btn btn-outline-light btn-sm rounded-pill px-3">Sign In</a>
        <a routerLink="/register" class="btn btn-light btn-sm text-primary rounded-pill px-3 fw-semibold">Register</a>
      </ng-container>
    </div>
  </div>
</nav>

<main class="bg-light min-vh-100 pb-5">
  <router-outlet></router-outlet>
</main>
