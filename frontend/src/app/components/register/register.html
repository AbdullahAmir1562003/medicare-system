<div class="d-flex justify-content-center align-items-center" style="min-height: 85vh;">
  <div class="card border-0 shadow-lg p-4 rounded-4" style="max-width: 460px; width: 100%;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
        <i class="bi bi-person-plus-fill fs-3"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Create an Account</h3>
      <p class="text-muted small">Join MediCare Healthcare Portal</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger py-2 small rounded-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success py-2 small rounded-3">
      <i class="bi bi-check-circle-fill me-2"></i>{{ successMessage }}
    </div>

    <form (ngSubmit)="onRegister()">
      <div class="mb-3">
        <label for="name" class="form-label small fw-semibold">Full Name</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
          <input
            type="text"
            id="name"
            class="form-control bg-light border-start-0"
            placeholder="John Doe"
            [(ngModel)]="userData.name"
            name="name"
            required
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
          <input
            type="email"
            id="email"
            class="form-control bg-light border-start-0"
            placeholder="name@example.com"
            [(ngModel)]="userData.email"
            name="email"
            required
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label small fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
          <input
            type="password"
            id="password"
            class="form-control bg-light border-start-0"
            placeholder="Create a strong password"
            [(ngModel)]="userData.password"
            name="password"
            required
          />
        </div>
      </div>

      <div class="mb-4">
        <label for="role" class="form-label small fw-semibold">Select Role</label>
        <select
          id="role"
          class="form-select bg-light"
          [(ngModel)]="userData.role"
          name="role"
          required
        >
          <option value="patient">Patient</option>
          <option value="doctor">Doctor</option>
          <option value="admin">Administrator</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
        Register
      </button>
    </form>

    <div class="text-center mt-4 pt-2 border-top">
      <p class="text-muted small mb-0">Already have an account? 
        <a routerLink="/login" class="text-primary fw-semibold text-decoration-none">Sign In</a>
      </p>
    </div>
  </div>
</div>
