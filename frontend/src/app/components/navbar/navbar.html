<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-2">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold d-flex align-items-center" routerLink="/">
      <i class="bi bi-heart-pulse-fill me-2 fs-4"></i>
      <span>MediCare</span>
    </a>

    <div class="ms-auto d-flex align-items-center">
      <!-- Show when Logged Out -->
      <ng-container *ngIf="!currentUser">
        <a class="btn btn-outline-light btn-sm me-2 rounded-pill px-3" routerLink="/login">Sign In</a>
        <a class="btn btn-light btn-sm text-primary fw-semibold rounded-pill px-3" routerLink="/register">Register</a>
      </ng-container>

      <!-- Show when Logged In -->
      <ng-container *ngIf="currentUser">
        <div class="d-flex align-items-center me-3 text-white">
          <div class="bg-white text-primary rounded-circle d-flex align-items-center justify-content-center me-2 fw-bold" style="width: 32px; height: 32px; font-size: 14px;">
            {{ currentUser.name.charAt(0).toUpperCase() }}
          </div>
          <div class="d-none d-sm-block text-start">
            <span class="small fw-semibold d-block lh-1">{{ currentUser.name }}</span>
            <span class="badge bg-light text-primary px-2 py-0 mt-1 text-uppercase" style="font-size: 10px;">{{ currentUser.role }}</span>
          </div>
        </div>
        <button class="btn btn-outline-light btn-sm rounded-pill px-3" (click)="onLogout()">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </ng-container>
    </div>
  </div>
</nav>
