<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card border-0 shadow-lg p-4 rounded-4" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
        <i class="bi bi-shield-lock-fill fs-3"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
      <p class="text-muted small">Sign in to your MediCare account</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger py-2 small rounded-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
          <input
            type="email"
            id="email"
            class="form-control bg-light border-start-0"
            placeholder="name@example.com"
            [(ngModel)]="credentials.email"
            name="email"
            required
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label small fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
          <input
            type="password"
            id="password"
            class="form-control bg-light border-start-0"
            placeholder="••••••••"
            [(ngModel)]="credentials.password"
            name="password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mt-2 shadow-sm">
        Sign In
      </button>
    </form>

    <div class="text-center mt-4 pt-2 border-top">
      <p class="text-muted small mb-0">Don't have an account? 
        <a routerLink="/register" class="text-primary fw-semibold text-decoration-none">Create Account</a>
      </p>
    </div>
  </div>
</div>
